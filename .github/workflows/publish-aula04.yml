name: Gerar materiais da Aula 04

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/aula04-source.b64'

permissions:
  contents: write

concurrency:
  group: publicar-aula04
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'thalesvalente/teaching-web-development'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ler a branch de publicacao
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - name: Materializar fontes verificadas e gerar HTMLs
        run: |
          set -eu
          python3 tools/materializar-aula04.py
          python3 tools/aula04/build.py
      - name: Verificar sintaxe e arquivos protegidos
        run: |
          set -eu
          node --check docs/instalar-course.mjs
          node --check tools/aula04/deck.js
          node --check tools/aula04/activity.js
          find lessons/aula-02-vite-vue-componentizacao/course -name '*.mjs' -print -exec node --check {} \;
          git diff --exit-code -- lessons/aula-02-vite-vue-componentizacao/src lessons/aula-02-vite-vue-componentizacao/package.json lessons/aula-02-vite-vue-componentizacao/package-lock.json
      - name: Registrar somente materiais da aula
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/aula04 docs/instalar-course.mjs docs/PREPARAR_VERIFICADOR.md docs/QA_AULA_04_WEB.md lessons/Aula_04_Web_v1.html lessons/aula-04-formularios-validacao lessons/aula-02-vite-vue-componentizacao/course index.html
          if git diff --cached --quiet; then
            echo 'Nenhuma mudanca nos materiais.'
          else
            git commit -m 'feat(aula04): publica aula interativa, atividade e missao individual'
            git push origin HEAD:main
          fi
          printf '## Materiais gerados\n\nCommit: `%s`\n\nO projeto dos alunos foi preservado. Ver docs/QA_AULA_04_WEB.md para limites de teste.\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
