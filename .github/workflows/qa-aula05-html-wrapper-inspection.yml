name: Diagnose Apps Script HtmlService wrapper (invalid POST)
on:
  push:
    branches: [qa/aula05-negative-post-diagnostics-20261023]
    paths: ['.github/workflows/qa-aula05-html-wrapper-inspection.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Inspect iframe shell for invalid nonce (no sheet write)
        run: |
          node --input-type=module - <<'JS'
          const url='https://script.google.com/macros/s/AKfycbyDC9tGFBTOjZXau4m2vWQVPoYa3gZKMldc1NjAMZCUstHx0SICMG8Z4ekAWvLfnmlc/exec';
          const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
            body:'nonce=x',signal:AbortSignal.timeout(20000)});
          const h=await r.text();
          const tag=h.match(/<iframe\b[^>]*>/i)?.[0]||'none';
          const scrub=s=>s.replace(/https?:\/\/[^"'\s<>)]*/gi,'[url]').replace(/user_content_key[^"'\s<>)]*/gi,'[redacted]').slice(0,900);
          const at=h.indexOf('script.googleusercontent');
          const around=at>=0?h.slice(Math.max(0,at-150),at+350):'not found';
          console.log('DIAG_WRAPPER',JSON.stringify({status:r.status,bytes:h.length,iframe:scrub(tag),nestedContext:scrub(around),end:scrub(h.slice(-850))}));
          const links=[...h.matchAll(/https:\/\/script\.googleusercontent\.com[^"'\s<>)]*/g)].map(x=>x[0]);
          console.log('NESTED_URL_COUNT',links.length);
          for(const u of links.slice(0,1)){
            try{
              const inner=await fetch(u,{redirect:'follow',signal:AbortSignal.timeout(10000)});
              const t=await inner.text();
              console.log('INNER',JSON.stringify({status:inner.status,host:new URL(inner.url).hostname,bytes:t.length,marker:t.includes('top.postMessage'),snippet:scrub(t.slice(0,240))}));
            }catch(e){console.log('INNER_FETCH_FAIL',String(e.message));}
          }
          JS
