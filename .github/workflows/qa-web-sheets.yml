name: QA | Google Sheets e Apps Script Web
on:
  push:
    branches:
      - feat/web-sheets-appscript-20261022
      - main
    paths:
      - 'integrations/web-appscript/**'
      - 'tests/web-entregas.test.cjs'
      - 'tests/web-receipt-parser.test.mjs'
      - 'scripts/web-receipt-parser.mjs'
      - '.github/workflows/qa-web-sheets.yml'
      - 'scripts/probe-web-appscript.mjs'
      - 'scripts/test-web-appscript-post.mjs'
  pull_request:
    paths:
      - 'integrations/web-appscript/**'
      - 'tests/web-entregas.test.cjs'
      - 'tests/web-receipt-parser.test.mjs'
      - 'scripts/web-receipt-parser.mjs'
      - 'lessons/aula-05-laboratorio-web-mobile/entrega-*.js'
      - 'lessons/aula-05-laboratorio-web-mobile/tests/web-entregas.spec.mjs'
      - '.github/workflows/qa-web-sheets.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: qa-web-sheets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-appscript:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validar sintaxe Javascript e limites de configuracao
        run: |
          node --check tests/web-entregas.test.cjs
          node --check lessons/aula-05-laboratorio-web-mobile/entrega-appscript.js
          node --check lessons/aula-05-laboratorio-web-mobile/entrega-config.js
          node --check scripts/probe-web-appscript.mjs
          node --check scripts/test-web-appscript-post.mjs
          node --check scripts/web-receipt-parser.mjs
          node --check tests/web-receipt-parser.test.mjs
      - name: Testes de recepcao mockada e integridade
        run: node --test tests/web-entregas.test.cjs tests/web-receipt-parser.test.mjs
      - name: Validar endpoint Web (vazio ou /exec) e ativacao explicita
        run: |
          node - <<'JS'
          const fs=require('fs');
          const cfg=fs.readFileSync('lessons/aula-05-laboratorio-web-mobile/entrega-config.js','utf8');
          const code=fs.readFileSync('integrations/web-appscript/Code.gs','utf8');
          const endpoint=cfg.match(/endpoint:\s*'([^']*)'/)?.[1];
          const flag=cfg.match(/activated:\s*(true|false)/)?.[1];
          if(endpoint===undefined)throw Error('Endpoint da disciplina Web ausente');
          if(flag===undefined)throw Error('Flag de ativação frontend ausente');
          if(endpoint&&!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(endpoint))
            throw Error('Endpoint não é um Web App /exec válido do Google Apps Script');
          if(flag==='true'&&!endpoint)throw Error('Não é possível ativar envio Web sem implantação /exec');
          if(!code.includes("getProperty('WEB_WEB_SUBMISSIONS_ENABLED')"))
            throw Error('Flag de proteção do backend ausente');
          if(!code.includes("!=='true'"))throw Error('Bloqueio deny-by-default ausente');
          console.log('WEB CONFIG PASS | endpoint '+(endpoint?'presente':'pendente')+
            ' | frontend '+(flag==='true'?'ativado':'bloqueado')+
            ' | backend protegido por ScriptProperties');
          JS
      - name: Validar fixture sem enviar POST ou criar linhas de aluno
        run: node scripts/test-web-appscript-post.mjs --dry-run
      - name: Consultar GET apenas após homologação e ativação explícita
        run: |
          node - <<'JS'
          const fs=require('fs'),{spawnSync}=require('child_process');
          const cfg=fs.readFileSync('lessons/aula-05-laboratorio-web-mobile/entrega-config.js','utf8');
          if (!/activated:\s*true/.test(cfg)) {
            console.log('WEB_GET_NOT_TESTED | URL cadastrada, recebimento não homologado e bloqueado.');
            process.exit(0);
          }
          const result=spawnSync(process.execPath,['scripts/probe-web-appscript.mjs','--require-enabled'],{stdio:'inherit'});
          process.exit(result.status??1);
          JS
      - name: Relatorio de integracao
        run: |
          printf '## Integração Web · receptor Apps Script\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Testes Node simulados passaram.\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'QA mockado não escreve na planilha. GET /exec só é consultado quando existe URL configurada.\n' >> "$GITHUB_STEP_SUMMARY"
