name: QA | Google Sheets e Apps Script Web
on:
  push:
    branches: [main]
    paths:
      - integrations/web-appscript/**
      - integrations/web-appscript-production/**
      - scripts/check-web-config.cjs
      - .github/workflows/qa-web-sheets.yml
      - lessons/aula-05-laboratorio-web-mobile/entrega-*.js
  pull_request:
    paths:
      - integrations/web-appscript/**
      - integrations/web-appscript-production/**
      - tests/web-entregas.test.cjs
      - tests/web-receipt-parser.test.mjs
      - scripts/check-web-config.cjs
      - lessons/aula-05-laboratorio-web-mobile/entrega-*.js
      - lessons/aula-05-laboratorio-web-mobile/tests/web-entregas.spec.mjs
      - .github/workflows/qa-web-sheets.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-web-sheets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-appscript:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validar sintaxe do cliente e verificador
        run: |
          node --check lessons/aula-05-laboratorio-web-mobile/entrega-appscript.js
          node --check lessons/aula-05-laboratorio-web-mobile/entrega-config.js
          node --check lessons/aula-05-laboratorio-web-mobile/production-gate.js
          node --check scripts/check-web-config.cjs
      - name: Testes históricos de recepção e integridade, sem rede
        run: node --test tests/web-entregas.test.cjs tests/web-receipt-parser.test.mjs
      - name: Validar configuração efetiva por origem e gate de produção
        run: node scripts/check-web-config.cjs
      - name: Validar fixture histórica sem POST nem escrita
        run: node scripts/test-web-appscript-post.mjs --dry-run
      - name: Registrar limites da CI
        run: |
          printf '## Web: configuração e integridade\n\nTestes locais e mocks aprovados. Nenhuma requisição para Google foi executada.\n\nA disponibilidade da implantação publicada é verificada separadamente.\n' >> "$GITHUB_STEP_SUMMARY"
