name: Web 3.2 — materializar código revisável e validar cadastro imutável
on:
  push:
    branches: [feat/web-roster-320-readonly-20261024]
    paths: ['.source/web320/**', '.github/workflows/build-web-roster-320.yml']
permissions:
  contents: write
concurrency:
  group: web-roster-320-build
  cancel-in-progress: false
jobs:
  candidate:
    if: github.actor == 'thalesvalente' && github.ref == 'refs/heads/feat/web-roster-320-readonly-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-roster-320-readonly-20261024
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar transporte de código e aplicar somente caminhos autorizados
        run: |
          python3 - <<'PY'
          import hashlib,json,lzma,pathlib,subprocess
          root=pathlib.Path.cwd()
          paths=['integrations/web-appscript-production/Code.gs','tests/web-production/harness.cjs','tests/web-production/production.test.cjs','tests/web-a05-id03/frontend-cache.test.cjs','.github/workflows/qa-web-roster-320.yml','docs/WEB_A05_320_EXECUCAO_20261024.md','scripts/check-web-config.cjs']
          lesson='lessons/aula-05-laboratorio-web-mobile/'
          paths += [lesson+p for p in ['roster-client.js','equipe-roster.js','entrega-config.js','production-gate.js','equipe.js','entrega-appscript.js','index.html','lab.js','report-print.js','identity-http.css','playwright.roster.config.mjs','tests/roster-320.spec.mjs','tests/lab.spec.mjs','tests/pdf-qa.spec.mjs','tests/web-entregas.spec.mjs','tests/http-site-identity.spec.mjs']]
          packet=b''.join((root/f'.source/web320/part-{i}.xz').read_bytes() for i in range(4))
          expected='a7841eba0ab2d0f51a98545bf8ad4a88ae32ddd72c3a75afb04ab6cbbbddf87e'
          assert hashlib.sha256(packet).hexdigest()==expected, 'PAYLOAD_HASH_MISMATCH'
          raw=lzma.decompress(packet,memlimit=128*1024*1024)
          assert len(raw)<500000,'PAYLOAD_TOO_LARGE'
          data=json.loads(raw)
          assert data['baseCommit']=='56872ee226f570b9287f20b7eed1838481ed7ff3'
          entries=data['patches']+data['files']
          assert sorted(x['path'] for x in entries)==sorted(paths),'PATH_ALLOWLIST_MISMATCH'
          for x in entries:
              p=root/x['path']
              assert not p.is_symlink() and root in p.resolve().parents
              if 'patch' in x:
                  assert hashlib.sha256(p.read_bytes()).hexdigest()==x['baseSha256'], 'BASE_DRIFT: '+x['path']
                  subprocess.run(['git','apply','--check','--whitespace=nowarn','-'],input=x['patch'],text=True,check=True)
                  subprocess.run(['git','apply','--whitespace=nowarn','-'],input=x['patch'],text=True,check=True)
              else:
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_text(x['content'],encoding='utf-8')
              assert hashlib.sha256(p.read_bytes()).hexdigest()==x['sha256'], 'OUTPUT_HASH_MISMATCH: '+x['path']
          pathlib.Path('/tmp/web320-paths.json').write_text(json.dumps(paths))
          print('SOURCE_INTEGRITY_PASS',len(paths),'files; no Google calls')
          PY
      - name: Sintaxe, cadastro somente leitura e regressões Node
        run: |
          node scripts/check-web-config.cjs
          node --test tests/web-production/*.test.cjs tests/web-a05-id03/*.test.cjs
          for f in lessons/aula-05-laboratorio-web-mobile/roster-client.js lessons/aula-05-laboratorio-web-mobile/equipe-roster.js lessons/aula-05-laboratorio-web-mobile/entrega-appscript.js; do node --check "$f"; done
      - name: Versionar código legível na branch candidata, sem merge ou deploy
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess
          paths=json.loads(pathlib.Path('/tmp/web320-paths.json').read_text())
          subprocess.run(['git','add','--']+paths,check=True)
          subprocess.run(['git','rm','--','.source/web320/part-0.xz','.source/web320/part-1.xz','.source/web320/part-2.xz','.source/web320/part-3.xz','.github/workflows/build-web-roster-320.yml'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','feat(web): consultar matrícula e confirmar nome com cadastro imutável — 3.2.0'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/feat/web-roster-320-readonly-20261024'],check=True)
          PY
      - name: Instalar navegadores de teste; nenhuma credencial Google
        working-directory: lessons/aula-05-laboratorio-web-mobile
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Cadastro imutável e identificação em três navegadores — Google simulado
        working-directory: lessons/aula-05-laboratorio-web-mobile
        run: npx playwright test -c playwright.roster.config.mjs --reporter=list
      - name: Regressão completa Chromium e lógica do laboratório
        working-directory: lessons/aula-05-laboratorio-web-mobile
        run: |
          npm run check:logic
          npx playwright test --reporter=list
      - name: Evidência de código e logs; sem matrículas reais
        if: always()
        run: |
          git rev-parse HEAD > /tmp/web320-COMMIT.txt
          git archive --format=zip HEAD -o /tmp/web320-candidate-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web320-candidate-source-and-results
          path: |
            /tmp/web320-candidate-source.zip
            /tmp/web320-COMMIT.txt
            lessons/aula-05-laboratorio-web-mobile/test-results/
          if-no-files-found: warn
          retention-days: 7
