name: Web 3.2 — aplicar correção revisada sem acesso ao Google
on:
  push:
    branches: [feat/web-roster-320-readonly-20261024]
    paths: ['scripts/web320-review-fix.patch', '.github/workflows/apply-web320-review-fix.yml']
permissions:
  contents: write
concurrency:
  group: web320-review-fix
  cancel-in-progress: false
jobs:
  apply-and-test:
    if: github.actor == 'thalesvalente' && github.ref == 'refs/heads/feat/web-roster-320-readonly-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-roster-320-readonly-20261024
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar somente os três arquivos revisados
        run: |
          python3 - <<'PY'
          import hashlib,pathlib,subprocess
          p=pathlib.Path('scripts/web320-review-fix.patch')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='09afc0b4de19b7651ecf2637f41372f510a7c7cfb2de23acc991beada8532b47'
          allowed=['integrations/web-appscript-production/Code.gs','tests/web-production/production.test.cjs','lessons/aula-05-laboratorio-web-mobile/tests/roster-320.spec.mjs']
          targets=[line[6:] for line in p.read_text().splitlines() if line.startswith('+++ b/')]
          assert targets==allowed
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply',str(p)],check=True)
          PY
          node scripts/check-web-config.cjs
          node --test tests/web-production/*.test.cjs tests/web-a05-id03/*.test.cjs
      - name: Commit somente do código e testes, sem alterar workflow ou produção
        run: |
          git add integrations/web-appscript-production/Code.gs tests/web-production/production.test.cjs lessons/aula-05-laboratorio-web-mobile/tests/roster-320.spec.mjs
          git rm scripts/web320-review-fix.patch
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then exit 9; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(web): conservar recibos históricos e corrigir fixture UTF-8 dos testes'
          git push origin HEAD:refs/heads/feat/web-roster-320-readonly-20261024
      - name: Preparar navegadores de teste
        working-directory: lessons/aula-05-laboratorio-web-mobile
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
          sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: G9 e confirmação em três navegadores, sem Google real
        working-directory: lessons/aula-05-laboratorio-web-mobile
        run: npx playwright test -c playwright.roster.config.mjs --reporter=list
      - name: Regressões do laboratório, identidade e PDF
        working-directory: lessons/aula-05-laboratorio-web-mobile
        run: |
          npm run check:logic
          npx playwright test --reporter=list
      - name: Preparar evidências
        if: always()
        run: |
          git rev-parse HEAD > /tmp/web320-reviewed-COMMIT.txt
          git archive --format=zip HEAD -o /tmp/web320-reviewed-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web320-reviewed-evidence
          path: |
            /tmp/web320-reviewed-COMMIT.txt
            /tmp/web320-reviewed-source.zip
            lessons/aula-05-laboratorio-web-mobile/test-results/
          retention-days: 7
