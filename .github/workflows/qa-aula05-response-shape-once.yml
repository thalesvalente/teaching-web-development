name: Diagnostico unico retorno QA v3
on:
  push:
    branches: [qa/aula05-response-shape-20261023]
    paths: ['.github/workflows/qa-aula05-response-shape-once.yml']
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Verificar versao antes de uma escrita ficticia
        run: node scripts/probe-web-appscript.mjs --require-enabled
      - name: POST apenas da equipe QA historica idempotente; registrar formato da resposta
        run: node scripts/diagnose-live-receipt-shape-once.mjs --confirm-write --url "https://script.google.com/macros/s/AKfycbyDC9tGFBTOjZXau4m2vWQVPoYa3gZKMldc1NjAMZCUstHx0SICMG8Z4ekAWvLfnmlc/exec"
