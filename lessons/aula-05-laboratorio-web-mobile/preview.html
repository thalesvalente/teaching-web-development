<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resultado do mesmo componente em duas larguras</title>
<style>
*{box-sizing:border-box}html{height:100%}body{margin:0;color:#244234;background:#edf4ee;font:13px/1.4 system-ui,Arial,sans-serif}
/* A versão anterior empilhava as prévias quando o iframe tinha menos de 650px,
   escondendo o resultado móvel. Agora as duas ficam VISÍVEIS simultaneamente
   sempre que couberem com pelo menos 210px cada. */
.dual{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:8px;align-items:start;min-width:0}
.display{min-width:0;border:1px solid #bdd2c3;border-radius:10px;background:white;overflow:hidden;box-shadow:0 6px 18px #1c503510}
.top{display:flex;gap:5px;align-items:center;padding:8px 7px;background:#dcece2;border-bottom:1px solid #cbdbcd;font-size:10px;line-height:1.2;font-weight:850;min-height:31px}
.dot{width:7px;height:7px;border-radius:50%;background:#8dbda2;flex:0 0 7px}
.viewport{background:#f1f7f2;padding:6px;min-height:390px}
#web-root,#mobile-root{width:100%;min-width:0}
.phone{margin:0 auto;border:4px solid #293932;max-width:330px;border-radius:17px;padding:6px 4px 5px;background:#fff;min-height:470px;min-width:0}
.notch{height:5px;width:55px;background:#364a3f;border-radius:20px;margin:0 auto 8px}
.mobile-wrapper{background:#f1f7f2;min-height:390px;padding:5px 3px 10px}
small{display:block;padding:7px 8px;color:#53675b;background:white;font-size:10px;line-height:1.4}
@media(max-width:445px){.dual{grid-template-columns:1fr}.viewport{min-height:310px}.phone{max-width:350px;min-height:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="dual">
  <section class="display" aria-label="Interface Web executada no navegador">
    <div class="top"><span class="dot"></span><strong>WEB</strong> · navegador</div>
    <div class="viewport"><div id="web-root"></div></div>
    <small>React Native Web: execução da mesma fonte.</small>
  </section>
  <section class="display" aria-label="Prévia de largura móvel executada no navegador">
    <div class="top"><span class="dot"></span><strong>MOBILE</strong> · largura estreita</div>
    <div class="mobile-wrapper"><div class="phone"><div class="notch" aria-hidden="true"></div><div id="mobile-root"></div></div></div>
    <small>Prévia no navegador. Não é Android/iOS nativo.</small>
  </section>
</div>
<script src="./assets/vendor.js"></script>
<script src="./preview.js"></script>
</body>
</html>
